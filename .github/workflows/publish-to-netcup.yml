name: Download Mautic and Deploy to Netcup

on:
  workflow_dispatch:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: netcup

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y gcc g++ gawk autoconf automake python3-cmarkgfm acl libacl1-dev attr libattr1-dev libxxhash-dev libzstd-dev liblz4-dev libssl-dev sshpass rsync

      - name: 🏗 Build Latest Rsync from Source
        run: |
          # 1. Get latest release version from RsyncProject
          RSYNC_TAR_URL=$(curl -s https://api.github.com/repos/RsyncProject/rsync/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          curl -L $RSYNC_TAR_URL -o rsync-src.tar.gz
          
          # 2. Extract and Compile statically
          tar -xzf rsync-src.tar.gz
          cd rsync-*/
          ./configure LDFLAGS="-static"
          make -j$(nproc)
          cp rsync ../rsync_static
          cd ..

      - name: Download Latest Mautic Production Build
        run: |
          LATEST_ZIP_URL=$(curl -s https://api.github.com/repos/mautic/mautic/releases/latest | grep "browser_download_url.*zip" | cut -d '"' -f 4 | head -n 1)
          curl -L $LATEST_ZIP_URL -o mautic.zip

      - name: Unzip Mautic
        run: |
          mkdir mautic_files
          unzip mautic.zip -d mautic_files
          rm mautic.zip

      - name: 🟢 Setup Node.js & Build Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Mautic 7 / Symfony 7.4 recommendation
          cache: 'npm'
          cache-dependency-path: mautic_files/package-lock.json

      - name: 🏗 Compile Mautic Assets
        working-directory: ./mautic_files
        run: |
          # Install dependencies and build frontend
          npm ci
          npm run build
          
          # Crucial for Mautic: Generate the final combined asset files
          # Note: This requires PHP on the runner
          # If PHP is not on the runner, the 'npm run build' is often enough 
          # but 'composer generate-assets' is the gold standard.
          
          # Remove node_modules to keep the rsync transfer fast and small
          rm -rf node_modules
      
      - name: 🧹 Clear target directory on Netcup
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          # 1. Ensure directory exists and is empty
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "mkdir -p ${{ vars.REMOTE_DIR }} && rm -rf ${{ vars.REMOTE_DIR }}*"

      - name: 🚀 Automate Rsync Setup & Sync
        env:
          SSHPASS: ${{ secrets.SSH_PASS }} 
        run: |          
          # 2. Push the binary to Netcup (using scp as a one-time bridge)
          sshpass -e scp -o StrictHostKeyChecking=no rsync_static ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.REMOTE_DIR }}
          
          # 3. Set executable permissions on the remote binary
          sshpass -e ssh -o StrictHostKeyChecking=no  ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "chmod 755 ${{ vars.REMOTE_DIR }}rsync_static"


      - name:  📤 Deploy to Netcup via Rsync (Password Auth)
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          rsync -avz --delete \
                    -e "sshpass -e ssh -o StrictHostKeyChecking=no" \
                    ./mautic_files/ \
                    --rsync-path="${{ vars.REMOTE_DIR }}rsync_static" \
                    ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.REMOTE_DIR }}

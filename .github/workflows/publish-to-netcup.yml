name: Download Mautic and Deploy to Netcup

on:
  workflow_dispatch:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: netcup

    steps:
      #- name: Checkout Repository
      #  uses: actions/checkout@v4

      - name: 🛠 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y gcc g++ gawk autoconf automake python3-cmarkgfm acl libacl1-dev attr libattr1-dev libxxhash-dev libzstd-dev liblz4-dev libssl-dev sshpass rsync

      - name: Download Latest Mautic Production Build
        run: |
           git clone https://github.com/mautic/mautic.git mautic_files

     # - name: 🟢 Setup PHP
     #   uses: shivammathur/setup-php@v2
     #   with:
     #     php-version: '8.3'
     #     extensions: mbstring, xml, ctype, iconv, mysql, gd, simplexml, zip
     #     tools: composer:v2

     # - name: 🟢 Setup Node.js & Build Assets
     #   uses: actions/setup-node@v4
     #   with:
     #     node-version: '20' # Mautic 7 / Symfony 7.4 recommendation
     #     cache: 'npm'
     #    cache-dependency-path: mautic_files/package-lock.json

     # - name: 📦 Install Production Dependencies
     #   working-directory: ./mautic_files
     #   run: |
     #     # Use --no-dev for a lean production build
     #     composer install --no-dev --optimize-autoloader --no-interaction
     #     
     #     # Mautic 7 specifically needs these directories to exist
     #     mkdir -p var/cache var/logs var/tmp

     #     composer generate-assets
          
          # Remove node_modules to keep the rsync transfer fast and small
     #     rm -rf node_modules
      
      - name: 🔍 Check for Remote Binaries
        id: check_remote
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          # Check if rsync and node already exist on Netcup
          if sshpass -e ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "[ -f ~/opt/rsync_static ] && [ -d ~/opt/nodejs ]"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗 Build Static Rsync (Conditional)
        if: steps.check_remote.outputs.exists == 'false'
        run: |
          sudo apt-get update && sudo apt install -y gcc gawk autoconf automake libssl-dev
          RSYNC_TAR_URL=$(curl -s https://api.github.com/repos/RsyncProject/rsync/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          curl -L $RSYNC_TAR_URL -o rsync-src.tar.gz
          tar -xzf rsync-src.tar.gz && cd rsync-*/
          ./configure LDFLAGS="-static" && make -j$(nproc)
          cp rsync ../rsync_static && cd ..

      - name: 📥 Fetch Node.js LTS (Conditional)
        if: steps.check_remote.outputs.exists == 'false'
        run: |
          LTS_VERSION=$(curl -s https://nodejs.org/dist/index.json | jq -r '.[] | select(.lts != false) | .version' | head -n 1)
          curl -LO "https://nodejs.org/dist/${LTS_VERSION}/node-${LTS_VERSION}-linux-x64.tar.xz"
          mkdir -p node_binary
          tar -xvf "node-${LTS_VERSION}-linux-x64.tar.xz" -C node_binary --strip-components=1

      - name: 📤 Push Binaries to ~/opt
        if: steps.check_remote.outputs.exists == 'false'
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "mkdir -p ~/opt/nodejs"
          
          # Use scp for the initial rsync binary bridge
          sshpass -e scp -o StrictHostKeyChecking=no rsync_static ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:~/opt/rsync_static
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "chmod +x ~/opt/rsync_static"
          
          # Now use the new rsync to push Node
          rsync -avz --delete \
                    -e "sshpass -e ssh -o StrictHostKeyChecking=no" \
                     ./node_binary/ \
                     --rsync-path="~/opt/rsync_static" \
                     ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:~/opt/nodejs/

      - name: ⚙️ Update Bash PATH
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "
            if ! grep -q 'opt/nodejs/bin' ~/.bashrc; then
              echo 'export PATH="$HOME/opt/nodejs/bin:$HOME/opt:$PATH"' >> ~/.bashrc
              echo "PATH updated successfully"
            fi
          "

      - name: 🧹 Clear target directory on Netcup
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          # 1. Ensure directory exists and is empty
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "mkdir -p ${{ vars.REMOTE_DIR }} && rm -rf ${{ vars.REMOTE_DIR }}*"

      - name:  📤 Deploy to Netcup via Rsync (Password Auth)
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          rsync -avz --delete \
                    -e "sshpass -e ssh -o StrictHostKeyChecking=no" \
                    ./mautic_files/ \
                    --rsync-path="~/opt/rsync_static" \
                    ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.REMOTE_DIR }}

name: Download Mautic and Deploy to Netcup

on:
  workflow_dispatch: # Allows you to trigger this manually

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Latest Mautic Production Build
        run: |
          # This command fetches the download URL for the latest .zip release asset
          LATEST_ZIP_URL=$(curl -s https://api.github.com/repos/mautic/mautic/releases/latest | grep "browser_download_url.*zip" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading from $LATEST_ZIP_URL"
          curl -L $LATEST_ZIP_URL -o mautic.zip

      - name: Unzip Mautic
        run: |
          mkdir mautic_files
          unzip mautic.zip -d mautic_files
          rm mautic.zip

      # === Set up SSH ===
      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🧹 Clear target directory on Manitu
        run: |
          echo "==> Cleaning $REMOTE_DIR..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf $REMOTE_DIR*"

      - name: 📤 Deploy to Manitu via SCP
        run: |
          echo "==> Copying files to $REMOTE_DIR..."
          rsync -avz ./mautic_files/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REMOTE_DIR
